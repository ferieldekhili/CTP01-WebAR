<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TP01 WebAR - Exercice 4</title>
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/3.4.7/aframe/build/aframe-ar.js"></script>
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <a-scene
      embedded
      arjs="sourceType: webcam; debugUIEnabled: false;"
      vr-mode-ui="enabled: false"
    >
      <a-marker preset="hiro">
        <a-box
          id="hiro-box"
          class="clickable"
          position="0 0.5 0"
          rotation="0 45 0"
          material="color: #3498db; opacity: 0.55; transparent: true"
          animation__spin="property: rotation; to: 0 405 0; loop: true; dur: 3000; easing: linear"
          animation__pulse="property: scale; startEvents: pulse; from: 1 1 1; to: 1.35 1.35 1.35; dur: 250; dir: alternate; loop: 1; easing: easeInOutQuad"
        ></a-box>
      </a-marker>

      <a-marker type="pattern" url="assets/pattern-custom-marker.patt">
        <a-cone
          position="0 0.7 0"
          radius-bottom="0.65"
          radius-top="0.12"
          height="1.4"
          material="color: #ff9f1c; metalness: 0.15; roughness: 0.35"
          animation="property: rotation; to: 0 360 0; loop: true; dur: 2500; easing: linear"
        ></a-cone>
      </a-marker>

      <a-entity
        camera
        cursor="rayOrigin: mouse"
        raycaster="objects: .clickable"
      ></a-entity>
    </a-scene>

    <script>
      const box = document.querySelector("#hiro-box");
      const colors = ["#3498db", "#e74c3c", "#2ecc71", "#f1c40f"];
      let colorIndex = 0;

      box.addEventListener("click", () => {
        colorIndex = (colorIndex + 1) % colors.length;
        box.setAttribute("material", "color", colors[colorIndex]);
        box.emit("pulse");
      });
    </script>
  </body>
</html>
