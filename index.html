<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TP01 WebAR - Exercice 6</title>
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/3.4.7/aframe/build/aframe-ar.js"></script>
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        font-family: Arial, sans-serif;
      }

      #controls {
        position: fixed;
        right: 16px;
        bottom: 16px;
        left: 16px;
        z-index: 10;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 18px;
        max-width: 520px;
        margin: 0 auto;
        padding: 14px 16px;
        color: #111827;
        background: rgba(255, 255, 255, 0.92);
        border: 1px solid rgba(17, 24, 39, 0.16);
        border-radius: 8px;
        box-shadow: 0 10px 26px rgba(0, 0, 0, 0.2);
      }

      #controls[hidden] {
        display: none;
      }

      .a-enter-vr,
      .a-enter-ar,
      .a-enter-vr-button,
      .a-enter-ar-button {
        display: none !important;
      }

      .size-control {
        display: flex;
        align-items: center;
        gap: 10px;
        min-width: 0;
      }

      .size-control label,
      #size-value {
        font-size: 14px;
        font-weight: 700;
      }

      #box-size {
        width: min(220px, 42vw);
        accent-color: #2563eb;
      }

      .color-palette {
        display: flex;
        gap: 8px;
      }

      .color-button {
        width: 34px;
        height: 34px;
        padding: 0;
        border: 2px solid #ffffff;
        border-radius: 50%;
        box-shadow: 0 0 0 1px rgba(17, 24, 39, 0.25);
        cursor: pointer;
      }

      .color-button:focus-visible {
        outline: 3px solid #111827;
        outline-offset: 2px;
      }

      @media (max-width: 480px) {
        #controls {
          align-items: stretch;
          flex-direction: column;
          gap: 12px;
        }

        #box-size {
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <a-scene
      embedded
      arjs="sourceType: webcam; debugUIEnabled: false;"
      vr-mode-ui="enabled: false"
    >
      <a-marker id="hiro-marker" preset="hiro">
        <a-box
          id="hiro-box"
          class="clickable"
          position="0 0.5 0"
          rotation="0 45 0"
          material="color: #3498db; opacity: 0.55; transparent: true"
          animation__spin="property: rotation; to: 0 405 0; loop: true; dur: 3000; easing: linear"
          animation__pulse="property: scale; startEvents: pulse; from: 1 1 1; to: 1.35 1.35 1.35; dur: 250; dir: alternate; loop: 2; easing: easeInOutQuad"
        ></a-box>
      </a-marker>

      <a-marker type="pattern" url="assets/pattern-custom-marker.patt">
        <a-cone
          position="0 0.7 0"
          radius-bottom="0.65"
          radius-top="0.12"
          height="1.4"
          material="color: #ff9f1c; metalness: 0.15; roughness: 0.35"
          animation="property: rotation; to: 0 360 0; loop: true; dur: 2500; easing: linear"
        ></a-cone>
      </a-marker>

      <a-entity
        camera
        cursor="rayOrigin: mouse"
        raycaster="objects: .clickable"
      ></a-entity>
    </a-scene>

    <div id="controls" hidden>
      <div class="size-control">
        <label for="box-size">Taille</label>
        <input id="box-size" type="range" min="0.1" max="3" step="0.1" value="1" />
        <span id="size-value">1.0</span>
      </div>

      <div class="color-palette" aria-label="Couleurs">
        <button
          class="color-button"
          type="button"
          data-color="#e74c3c"
          style="background: #e74c3c"
          aria-label="Rouge"
        ></button>
        <button
          class="color-button"
          type="button"
          data-color="#2ecc71"
          style="background: #2ecc71"
          aria-label="Vert"
        ></button>
        <button
          class="color-button"
          type="button"
          data-color="#3498db"
          style="background: #3498db"
          aria-label="Bleu"
        ></button>
      </div>
    </div>

    <script>
      const hiroMarker = document.querySelector("#hiro-marker");
      const box = document.querySelector("#hiro-box");
      const controls = document.querySelector("#controls");
      const sizeSlider = document.querySelector("#box-size");
      const sizeValue = document.querySelector("#size-value");
      const colors = ["#3498db", "#e74c3c", "#2ecc71"];
      let colorIndex = 0;
      let currentSize = Number(sizeSlider.value);

      const setBoxSize = (size) => {
        currentSize = size;
        box.setAttribute("scale", `${size} ${size} ${size}`);
        sizeValue.textContent = size.toFixed(1);
      };

      const configurePulse = () => {
        const pulseSize = Math.min(currentSize * 1.25, 3);

        box.setAttribute(
          "animation__pulse",
          `property: scale; startEvents: pulse; from: ${currentSize} ${currentSize} ${currentSize}; to: ${pulseSize} ${pulseSize} ${pulseSize}; dur: 250; dir: alternate; loop: 2; easing: easeInOutQuad`
        );
      };

      hiroMarker.addEventListener("markerFound", () => {
        controls.hidden = false;
      });

      hiroMarker.addEventListener("markerLost", () => {
        controls.hidden = true;
      });

      box.addEventListener("click", () => {
        colorIndex = (colorIndex + 1) % colors.length;
        box.setAttribute("material", "color", colors[colorIndex]);
        configurePulse();
        box.emit("pulse");
      });

      box.addEventListener("animationcomplete__pulse", () => {
        setBoxSize(currentSize);
      });

      sizeSlider.addEventListener("input", () => {
        setBoxSize(Number(sizeSlider.value));
      });

      document.querySelectorAll(".color-button").forEach((button) => {
        button.addEventListener("click", () => {
          const color = button.dataset.color;
          colorIndex = colors.indexOf(color);
          box.setAttribute("material", "color", color);
        });
      });
    </script>
  </body>
</html>
